# Anti force brute : 10 tentatives par minute et par IP sur la connexion et l'inscription (fichier inclus dans http{}).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    # En-têtes de sécurité sur toutes les réponses. `merge` : les add_header d'une location s'y ajoutent au lieu
    # de les remplacer (nginx >= 1.29.3). CSP : scripts et iframe du captcha Turnstile, styles inline de Radix.
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Le backend compare l'Origin au Host (port compris, d'où $http_host et non $host).
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Doc de l'API servie par FastAPI, accessible depuis le même domaine.
    location ~ ^/(docs|redoc|openapi.json) {
        # Swagger et ReDoc chargent leurs scripts depuis cdn.jsdelivr.net, avec un script inline : pas de CSP ici.
        add_header_inherit off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        proxy_pass http://backend:8000;
    }

    # APK Android (android/dist, monté par docker-compose) : 404 tant qu'il n'est pas compilé, ce qui cache le
    # bouton « Télécharger ». Même nom à chaque version : revalidé à chaque téléchargement.
    location = /newmannheim.apk {
        alias /usr/share/nginx/apk/newmannheim.apk;
        # Type APK (absent du mime.types de nginx) : le téléphone propose de l'installer.
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="newmannheim.apk"';
        add_header Cache-Control "no-cache";
    }

    # Version de l'APK compilé (écrite par android/build.sh) : l'app propose « Mettre à jour » si elle est plus récente.
    location = /newmannheim-version.json {
        alias /usr/share/nginx/apk/newmannheim-version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Fichiers du build, au nom haché : ils ne changent jamais, le navigateur les garde.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (et les routes de l'app) : revalidé à chaque visite, sinon un téléphone garde l'ancienne version
    # après un déploiement.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
